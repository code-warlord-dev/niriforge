[package]
name = "niriforge"
version = "0.1.4"
description = "GUI configurator for niri Wayland compositor"
authors = ["code_warlord"]
edition = "2021"
license = "MIT"

[lib]
name = "niriforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
kdl = "4"
schemars = "0.8"
notify = "6"
tokio = { version = "1", features = ["full"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
